# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 42

n_timesteps: !!float 1e6
policy: 'MlpPolicy'
n_steps: 256
batch_size: 3200
gae_lambda: 0.95
gamma: 0.99
n_epochs: 20
ent_coef: 0.0005 #0.01 # TODO
learning_rate: !!float 3e-4
clip_range: !!float 0.2
policy_kwargs:
  activation_fn: 'nn.ELU'
  #net_arch: [32, 32]
  net_arch:
    pi: [64, 64]  # policy
    vf: [128, 128] # critic
  squash_output: False
  log_std_init: -20.0 # TODO # key，if use bc to rl，set log_std_init small 
                
vf_coef: 1.0
max_grad_norm: 1.0
device: "cuda:0"